name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      - name: Build release archive
        env:
          RELEASE_ID: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p package
          cp -R src package/src
          cp package.json package/package.json
          printf '{"version":"%s","commit":"%s"}\n' "$RELEASE_ID" "$COMMIT" > package/release.json
          tar -czf "sdlc-demo-node-${RELEASE_ID}.tgz" -C package .
          sha256sum "sdlc-demo-node-${RELEASE_ID}.tgz" > "sdlc-demo-node-${RELEASE_ID}.tgz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sdlc-demo-node-${{ github.ref_name }}.tgz
            sdlc-demo-node-${{ github.ref_name }}.tgz.sha256
