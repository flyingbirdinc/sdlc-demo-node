name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to deploy
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ZONE: ${{ vars.GCP_ZONE }}
  INSTANCE: ${{ vars.GCP_INSTANCE_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Select release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: echo "tag=${EVENT_TAG:-$INPUT_TAG}" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --output release.tgz
      - name: Copy release through IAP
        run: |
          gcloud compute scp release.tgz "$INSTANCE:/tmp/sdlc-demo-${{ github.sha }}.tgz" \
            --project="$PROJECT_ID" --zone="$ZONE" --tunnel-through-iap
      - name: Install release through IAP
        run: |
          gcloud compute ssh "$INSTANCE" --project="$PROJECT_ID" --zone="$ZONE" --tunnel-through-iap \
            --command="sudo /opt/sdlc-demo/bin/deploy.sh /tmp/sdlc-demo-${{ github.sha }}.tgz ${{ steps.release.outputs.tag }}"
      - name: Record deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Deployed to the SDLC demo VM',
              auto_merge: false
            });
